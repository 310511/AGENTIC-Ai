[pytest]
asyncio_mode = auto
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts =
    --strict-markers
    -q

markers =
    integration: marks tests that require running infrastructure (deselect with -m "not integration")
    security: marks security and authorization tests
    slow: marks tests that take more than 2 seconds
