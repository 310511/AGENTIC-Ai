[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-agent-auth"
version = "0.1.0"
description = "Shared JWT validation and RBAC helpers for the AI Agent Platform"
requires-python = ">=3.11"
dependencies = [
    "pyjwt[crypto]==2.8.0",
    "pydantic[email]==2.7.1",
    # shortcut: ai-agent-contracts is installed separately in the Dockerfile; add if publishing to PyPI
]

[tool.setuptools.packages.find]
where = [".."]
include = ["auth*"]
