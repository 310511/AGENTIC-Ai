# ============================================================
# Prometheus configuration
# Scrapes metrics from the OTel Collector's Prometheus exporter
# and from individual services that expose /metrics.
# ============================================================

global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    environment: development

scrape_configs:
  # OTel Collector self-metrics
  - job_name: otel-collector
    static_configs:
      - targets: ["otel-collector:8888"]

  # OTel Collector Prometheus exporter (service metrics forwarded by OTel)
  - job_name: agent-platform
    static_configs:
      - targets: ["otel-collector:8889"]

  # API service (if it exposes a /metrics endpoint directly)
  - job_name: agent-api
    static_configs:
      - targets: ["api:8000"]
    metrics_path: /metrics

  # Prometheus self-monitoring
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
