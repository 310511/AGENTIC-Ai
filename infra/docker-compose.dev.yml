# ============================================================
# Phase 1+2 dev stack
# Services: postgres, redis, rabbitmq, api, orchestrator
#
# Ollama runs locally on the host (not in Docker).
# Start it with: ollama serve
# Pull a model with: ollama pull llama3.2
#
# Usage:
#   docker compose -f infra/docker-compose.dev.yml up -d
# ============================================================


networks:
  agent-net:
    driver: bridge

volumes:
  postgres-data:
  redis-data:
  rabbitmq-data:

services:

  postgres:
    image: postgres:16-alpine
    container_name: agent-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: agent_platform
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres_dev_password}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    ports:
      - "5432:5432"
    networks:
      - agent-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d agent_platform"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  redis:
    image: redis:7-alpine
    container_name: agent-redis
    restart: unless-stopped
    command: >
      redis-server
      --requirepass ${REDIS_PASSWORD:-redis_dev_password}
      --appendonly yes
    volumes:
      - redis-data:/data
    ports:
      - "6379:6379"
    networks:
      - agent-net
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-redis_dev_password}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    container_name: agent-rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER:-guest}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS:-guest}
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"  # Management UI → http://localhost:15672
    networks:
      - agent-net
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 20s

  api:
    build:
      context: ..
      dockerfile: services/api/Dockerfile
    container_name: agent-api
    restart: unless-stopped
    env_file:
      - ../.env
    environment:
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD:-postgres_dev_password}@postgres:5432/agent_platform
      REDIS_URL: redis://:${REDIS_PASSWORD:-redis_dev_password}@redis:6379/0
      RABBITMQ_URL: amqp://${RABBITMQ_DEFAULT_USER:-guest}:${RABBITMQ_DEFAULT_PASS:-guest}@rabbitmq:5672/
      # Neo4j and OTel not available in dev stack — set dummy values so
      # config validation passes. These features are inactive in Phase 1.
      NEO4J_URI: bolt://localhost:7687
      NEO4J_PASSWORD: not-used-in-phase-1
      OTEL_EXPORTER_OTLP_ENDPOINT: http://localhost:4317
      ORCHESTRATOR_URL: http://orchestrator:8001
    ports:
      - "8000:8000"
    networks:
      - agent-net
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/health')\""]
      interval: 20s
      timeout: 5s
      retries: 3
      start_period: 15s

  # ── Orchestrator ──────────────────────────────────────────────────────────────
  orchestrator:
    build:
      context: ..
      dockerfile: services/orchestrator/Dockerfile
    container_name: agent-orchestrator
    restart: unless-stopped
    env_file:
      - ../.env
    environment:
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD:-postgres_dev_password}@postgres:5432/agent_platform
      OLLAMA_BASE_URL: http://host.docker.internal:11434
      DEFAULT_LLM_MODEL: llama3.2
      NEO4J_PASSWORD: not-used-in-phase-2
    ports:
      - "8001:8001"
    networks:
      - agent-net
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8001/health')\""]
      interval: 20s
      timeout: 5s
      retries: 3
      start_period: 20s

  # ── Ollama (local LLM inference) ───────────────────────────────────────────
  # Ollama runs on the host, not in Docker.
  # host.docker.internal:11434 is used to reach it from containers.
